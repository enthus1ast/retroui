name: Release

# Every app (the table in retro.nimble) for every system: AppImages for
# Linux, .exe for Windows, APKs for Android, zipped .app for macOS. Run by
# hand (Actions > Release > Run workflow) or by a tag: a tag "v..." also
# makes a GitHub release with all of them.
#
# APKs are signed with the key in the secrets ANDROID_KEY_PEM and
# ANDROID_CERT_DER (base64 of ~/.retro/android/debug-key.pem and
# debug-cert.der), so a new APK installs over the one before; without them
# each run makes a key of its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Retro Mail's app registrations (examples/mail/appids.nim): repository
# secrets, so the packages sign in with one click
env:
  RETRO_MAIL_MICROSOFT_ID: ${{ secrets.RETRO_MAIL_MICROSOFT_ID }}
  RETRO_MAIL_GOOGLE_ID: ${{ secrets.RETRO_MAIL_GOOGLE_ID }}
  RETRO_MAIL_GOOGLE_SECRET: ${{ secrets.RETRO_MAIL_GOOGLE_SECRET }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: zig (links against an older glibc, for older systems)
        run: pip install ziglang
      - name: AppImages
        run: nimble appimages -y
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/*.AppImage

  windows:
    # from Linux, with MinGW: the icon and the version go into each .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Windows programs
        run: nimble exes -y
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/win/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Signing key
        env:
          KEY: ${{ secrets.ANDROID_KEY_PEM }}
          CERT: ${{ secrets.ANDROID_CERT_DER }}
        run: |
          if [ -n "$KEY" ] && [ -n "$CERT" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/keys/debug-key.pem"
            echo "$CERT" | base64 -d > "$RUNNER_TEMP/keys/debug-cert.der"
            echo "RETRO_KEYS=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"
          else
            echo "no signing key in the secrets: this run makes one"
          fi
      - name: APKs
        run: nimble apks -y
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/*.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: macOS apps
        run: nimble macapps -y
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/mac/*.zip

  release:
    # a tag: one GitHub release with everything
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
