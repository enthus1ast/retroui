name: Release

# One app of the examples (the table in retroui.nimble), for the systems you
# tick: an AppImage for Linux, an .exe for Windows, an APK for Android, a
# zipped .app for macOS. Only by hand: Actions > Release > Run workflow,
# choose the app; give a tag (v0.20.0) to also make a GitHub release with
# the files. Nothing builds the examples on its own -- not a push, not a
# tag, not `nimble install`.
#
# APKs are signed with the key in the secrets ANDROID_KEY_PEM and
# ANDROID_CERT_DER (base64 of ~/.retro/android/debug-key.pem and
# debug-cert.der), so a new APK installs over the one before; without them
# each run makes a key of its own.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "The app to build"
        required: true
        type: choice
        options: [photo, files, board, mail, gallery, hrbook, notepad, ledger, charts]
      linux:
        description: "Linux (AppImage)"
        type: boolean
        default: true
      windows:
        description: "Windows (.exe)"
        type: boolean
        default: true
      android:
        description: "Android (APK)"
        type: boolean
        default: true
      macos:
        description: "macOS (.app)"
        type: boolean
        default: false
      tag:
        description: "Make a GitHub release with this tag (empty: no release)"
        required: false
        default: ""

# Retro Mail's app registrations (examples/mail/appids.nim): repository
# secrets, so the packages sign in with one click
env:
  RETRO_MAIL_MICROSOFT_ID: ${{ secrets.RETRO_MAIL_MICROSOFT_ID }}
  RETRO_MAIL_GOOGLE_ID: ${{ secrets.RETRO_MAIL_GOOGLE_ID }}
  RETRO_MAIL_GOOGLE_SECRET: ${{ secrets.RETRO_MAIL_GOOGLE_SECRET }}

jobs:
  linux:
    if: inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: zig (links against an older glibc, for older systems)
        run: pip install ziglang
      - name: AppImage
        run: RETRO_APP=${{ inputs.app }} nimble appimage -y
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/*.AppImage

  windows:
    # from Linux, with MinGW: the icon and the version go into the .exe
    if: inputs.windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Windows program
        run: RETRO_APP=${{ inputs.app }} nimble exe -y
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/win/*.exe

  android:
    if: inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Signing key
        env:
          KEY: ${{ secrets.ANDROID_KEY_PEM }}
          CERT: ${{ secrets.ANDROID_CERT_DER }}
        run: |
          if [ -n "$KEY" ] && [ -n "$CERT" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/keys/debug-key.pem"
            echo "$CERT" | base64 -d > "$RUNNER_TEMP/keys/debug-cert.der"
            echo "RETRO_KEYS=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"
          else
            echo "no signing key in the secrets: this run makes one"
          fi
      - name: APK
        run: RETRO_APP=${{ inputs.app }} nimble appapk -y
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/*.apk

  macos:
    if: inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: macOS app
        run: RETRO_APP=${{ inputs.app }} nimble macapp -y
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/mac/*.zip

  release:
    # a tag given: one GitHub release with what was built
    if: ${{ always() && inputs.tag != '' && !contains(needs.*.result, 'failure') }}
    needs: [linux, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true
