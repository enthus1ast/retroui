<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg [ <!ENTITY accent "#e85d04"> ]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120"
     viewBox="0 0 120 120">
  <title>Kitchen sink</title>
  <style>
    .warm { fill: &accent; }
    g.box > rect { stroke: #333; stroke-width: 2 }
    #dot { fill: hsl(210, 80%, 45%) }
    /* a comment */
    rect.ignored { fill: red !important }
  </style>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ef476f" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="lg2" xlink:href="#lg" gradientTransform="rotate(90 .5 .5)"/>
    <radialGradient id="rg" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="white"/><stop offset="1" stop-color="rgb(6,214,160)"/>
    </radialGradient>
    <symbol id="star" viewBox="0 0 10 10"><path d="M5 0 6.2 3.8H10L7 6.2 8.1 10 5 7.6 1.9 10 3 6.2 0 3.8H3.8z"/></symbol>
    <clipPath id="cp"><circle cx="90" cy="30" r="22"/></clipPath>
    <mask id="mk"><rect width="120" height="120" fill="url(#lg2)"/></mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>
  <g class="box"><rect x="6" y="6" width="48" height="48" rx="8" fill="url(#lg)"/></g>
  <g clip-path="url(#cp)">
    <rect x="60" y="0" width="60" height="60" fill="url(#rg)"/>
    <path d="M60 30h60" stroke="#118ab2" stroke-width="6" stroke-dasharray="6 3"/>
  </g>
  <path class="warm" fill-rule="evenodd" d="M10 62h40v40H10zM20 72h20v20H20z"/>
  <path d="M65 75a15 15 0 1 0 30 0a15 15 0 1 0-30 0z" fill="none" stroke="currentColor" stroke-width="4"/>
  <use xlink:href="#star" x="96" y="62" width="18" height="18" fill="#ffd166" transform="rotate(10 105 71)"/>
  <circle id="dot" cx="80" cy="100" r="8" opacity=".7"/>
  <polyline points="56,116 71,100 86,112 111,95" fill="none" stroke="#333" stroke-width="2"
            marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
  <ellipse cx="30" cy="110" rx="22" ry="7" fill="#073b4c" transform="translate(40 0) skewX(-20)" mask="url(#mk)"/>
  <rect class="ignored" x="0" y="0" width="2" height="2" style="fill: blue"/>
</svg>
